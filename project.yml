name: VocabularyLib
options:
  bundleIdPrefix: com.vocabularylib
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    TARGETED_DEVICE_FAMILY: "1,2"
schemes:
  VocabularyLib:
    build:
      targets:
        VocabularyLib: all
    test:
      targets:
        - VocabularyLibTests
        - VocabularyLibUITests
  VocabularyLibMac:
    build:
      targets:
        VocabularyLibMac: all
targets:
  VocabularyLib:
    type: application
    platform: iOS
    sources:
      - path: VocabularyLib
    dependencies:
      - target: VocabularyWidget
      - sdk: libsqlite3.tbd
    info:
      path: VocabularyLib/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: com.vocabularylib.app
            CFBundleURLSchemes:
              - vocabularylib
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vocabularylib.app
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: VN4X5HF5ZJ
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "用于拍摄包含英文单词的照片，并识别后加入你的单词本。"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  VocabularyLibMac:
    type: application
    platform: macOS
    sources:
      - path: VocabularyLibMac
      - path: VocabularyLib/Models
      - path: VocabularyLib/Services
      - path: VocabularyLib/Stores
      - path: VocabularyLib/Shared
      - path: VocabularyLib/Resources
        buildPhase: resources
        excludes:
          - "*.bak.*"
    dependencies:
      - sdk: libsqlite3.tbd
    info:
      path: VocabularyLibMac/Info.plist
      properties:
        CFBundleDisplayName: Vocabulary Lib
        LSApplicationCategoryType: public.app-category.education
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vocabularylib.app.mac
        PRODUCT_NAME: VocabularyLibMac
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: VN4X5HF5ZJ
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  VocabularyWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: VocabularyWidget
    info:
      path: VocabularyWidget/Info.plist
      properties:
        CFBundleDisplayName: 单词本小组件
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vocabularylib.app.widget
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: VN4X5HF5ZJ
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
  VocabularyLibUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: VocabularyLibUITests
    dependencies:
      - target: VocabularyLib
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: VocabularyLib
  VocabularyLibTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: VocabularyLibTests
    dependencies:
      - target: VocabularyLib
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
